name: claims

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Every number in the README, re-derived from committed JSON
        run: python scripts/verify_claims.py --show
      - name: Artifacts reproduce (run timing ignored, numbers not)
        run: python scripts/check_reproducible.py
      - name: Every local link resolves to a committed file
        run: python scripts/check_links.py
      - name: No unlicensed corpora or model weights committed
        run: |
          set -e
          if git ls-files | grep -Ei '\.npy$|NEW_MP_Data|\.task$'; then
            echo "::error::dataset tensors or model weights are tracked in this repo"
            exit 1
          fi
          test "$(git ls-files | grep -c '^media/.*\.mp4$')" -eq 10
          echo "10 attributed clips tracked: 2 demos + 8 form-tour excerpts"
